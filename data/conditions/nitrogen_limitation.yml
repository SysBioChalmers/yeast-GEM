# Nitrogen-limiting conditions. Enables glutamate synthase (Glt1) and the
# glycine cleavage system, which yeast-GEM blocks by default because both
# are repressed under nitrogen excess.
# Reference: doi:10.1128/EC.2.5.827-829.2003.

name: nitrogen_limitation
description: Nitrogen limitation (glutamate synthase and glycine cleavage enabled).

bounds:
  - { rxn: r_0472, ub: 1000, comment: "glutamate synthase (Glt1)" }
  - { rxn: r_0501, ub: 1000, comment: "glycine cleavage, mitochondrion" }
  - { rxn: r_0507, ub: 1000, comment: "glycine cleavage complex (lipoylprotein), mitochondrion" }
  - { rxn: r_0509, ub: 1000, comment: "glycine cleavage complex (lipoamide), mitochondrion" }
