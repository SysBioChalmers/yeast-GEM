# Anaerobic conditions for yeast-GEM. Mirrors code/otherChanges/
# anaerobicModel.m as of release v9.1.0. Documentation references:
#   - heme/AA ratio: anaerobicModel.m
#   - sterol/fatty acid supplementation: anaerobicModel.m
#   - MDH2 / IDP2 blocking: Hung et al 2004 (10.1074/jbc.M404544200),
#     Tai et al 2005 (10.1074/jbc.M410573200), Sjöberg et al 2023
#     (10.1016/j.ymben.2024.01.007)
#   - FADH2 recycling via fumarate reductase: Camarasa et al 2007
#     (10.1002/yea.1467), Kim et al 2018 (10.1038/s41467-018-07285-9)

name: anaerobic
description: Convert aerobic yeast-GEM to anaerobic conditions.

# Cofactor pseudoreaction adjustments (heme a removal + H+ rebalance).
# After removing the listed mets from the pseudoreaction, the
# `charge_balance_met` coefficient is recomputed so total charge sums
# to zero — mirrors the explicit recomputation in anaerobicModel.m.
cofactor_pseudoreaction:
  rxn_id: r_4598
  remove_mets:
    - { met: s_3714, comment: heme a }
  charge_balance_met: s_0794            # H+ rebalanced after the removal

# Switch amino acid ratio in protein pseudoreaction to the anaerobic
# column of data/physiology/aminoAcid_Bjorkeroth2020.tsv. Equivalent to
# `changeAminoAcidRatio(model, false)` in MATLAB.
amino_acid_ratio: anaerobic

# Add to the biomass pseudoreaction (combine with existing coefficients).
# FADH2 production constant 0.08 supports Ero1-mediated disulphide bond
# formation under anaerobic growth (see references above).
biomass_stoichiometry_delta:
  rxn_id: r_4041
  add:
    - { met: s_0689, coef:  0.08, comment: "FADH2[c]" }
    - { met: s_0687, coef: -0.08, comment: "FAD[c]" }
    - { met: s_0794, coef: -0.16, comment: "H+[c] (2 protons per FADH2)" }

bounds:
  # Block aerobic respiration
  - { rxn: r_1992, lb: 0,     comment: oxygen exchange — block uptake }
  # Allow sterol uptake (essential anaerobic supplement)
  - { rxn: r_1757, lb: -1000, comment: ergosterol exchange }
  - { rxn: r_1915, lb: -1000, comment: lanosterol exchange }
  - { rxn: r_2106, lb: -1000, comment: zymosterol exchange }
  - { rxn: r_2134, lb: -1000, comment: 14-demethyllanosterol exchange }
  # Allow fatty acid uptake
  - { rxn: r_1994, lb: -1000, comment: palmitoleate exchange }
  - { rxn: r_2189, lb: -1000, comment: oleate exchange }
  # Block tetraen-3beta-ol (NADH recycling to ergosterol — v9.1.0 fix)
  - { rxn: r_2137, lb: 0,     comment: "ergosta-5,7,22,24(28)-tetraen-3beta-ol exchange — block" }
  # Allow vitamin uptake for NAD(P)H and CoA synthesis
  - { rxn: r_1967, lb: -1000, comment: nicotinate exchange }
  - { rxn: r_1548, lb: -1000, comment: "(R)-pantothenate exchange" }
  # Block MDH2 — repressed under anaerobic growth on glucose
  - { rxn: r_0714, lb: 0, ub: 0, comment: MDH2 (malate dehydrogenase) }
  # Block IDP2 — repressed in transcriptome and not detected in proteome
  - { rxn: r_0659, lb: 0, ub: 0, comment: IDP2 (isocitrate dehydrogenase, cytosolic) }
