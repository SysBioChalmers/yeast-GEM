# Glycine as sole nitrogen source. Enables the glycine cleavage system,
# which yeast-GEM blocks by default (repressed unless glycine is the sole
# nitrogen source).
# References:
#   - doi:10.1111/j.1567-1364.2002.tb00069.x
#   - doi:10.1074/jbc.274.15.10523
#   - doi:10.1128/EC.2.5.827-829.2003

name: glycine_nitrogen
description: Glycine as sole nitrogen source (glycine cleavage enabled).

bounds:
  - { rxn: r_0501, lb: 0, ub: 1000, comment: "glycine cleavage, mitochondrion" }
  - { rxn: r_0507, lb: 0, ub: 1000, comment: "glycine cleavage complex (lipoylprotein), mitochondrion" }
  - { rxn: r_0509, lb: 0, ub: 1000, comment: "glycine cleavage complex (lipoamide), mitochondrion" }
