[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yeastgem"
version = "0.0.1.dev0"
description = "Python interface to the yeast-GEM consensus genome-scale metabolic model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [{ name = "SysBioChalmers", email = "info@sysbiochalmers.se" }]
keywords = ["systems biology", "metabolic model", "yeast", "Saccharomyces cerevisiae", "cobra"]

# Per Decision #1 in PORTING_PLAN.md: no ravengem dependency. cobrapy is
# the baseline. Generic helpers that could live upstream are tracked in
# UPSTREAM_CANDIDATES.md and implemented locally for now.
dependencies = [
    "cobra>=0.29",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.urls]
"Source" = "https://github.com/SysBioChalmers/yeast-GEM"
"Issues" = "https://github.com/SysBioChalmers/yeast-GEM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["yeastgem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
