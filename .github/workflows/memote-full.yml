name: MEMOTE full suite

# The full MEMOTE suite (flux variability and a loopless MILP over every reaction)
# takes hours, so it runs on demand only: comment /run memote on a pull request (see
# pr-command.yml), which dispatches this workflow on the pull request branch. When it
# finishes it commits the score and updates the Model QC comment.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull-request number whose Model QC comment is updated"
        required: true

jobs:
  memote-full:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      pull-requests: write

    env:
      HEAD_REF: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      URL_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/data/testResults
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem and memote
        run: pip install -e "code/python/[gurobi]" memote

      - name: Install the Gurobi WLS licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: python code/python/tests/ci/pipeline.py licence

      - name: Resolve the base branch of the pull request
        run: |
          base=$(gh pr view "$PR" --repo "${{ github.repository }}" --json baseRefName --jq .baseRefName)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"

      # A timeout (exit 124) leaves the committed score as it was. Any other
      # failure fails the run: producing the score is the purpose of this workflow.
      - name: Score the pull request (full suite)
        run: |
          set +e
          timeout 19800 python -u code/python/tests/ci/memote_snapshot.py --full --out results/head
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "::warning::MEMOTE did not finish within the time limit; the score is unchanged."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # The suite runs for hours, during which the branch can move on: a results
      # run of Model QC, or the user's own push. Start from the branch as it is
      # now, then put the score on it.
      - name: Update the local branch and put the score on it
        run: |
          git fetch origin "$HEAD_REF"
          git reset --hard "origin/$HEAD_REF"
          if [ -f results/head/memote_score.md ]; then
            cp results/head/memote_score.md data/testResults/memote_score.md
          fi

      - name: Fetch the target branch's committed results
        run: |
          mkdir -p results/base
          git fetch --depth=1 origin "$BASE_REF"
          for f in qc_metrics.tsv validation_metrics.tsv essentialGenes.tsv memote_score.md annotation_metrics.tsv qc_status.tsv; do
            git show "origin/$BASE_REF:data/testResults/$f" > "results/base/$f" 2>/dev/null || rm -f "results/base/$f"
          done

      - name: Render the report
        run: |
          python code/python/tests/ci/build_qc_report.py \
            --current data/testResults --base results/base \
            --base-ref "$BASE_REF" --url-base "$URL_BASE" --detail-base "$URL_BASE" \
            --run-url "$RUN_URL" --out report.md \
            --summary-out data/testResults/model_qc_summary.md
          python code/python/tests/ci/pipeline.py stamp \
            --pr "$PR" --group memote

      - name: Commit the score
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: yeast-gem-bot
          commit_message: "chore: full MEMOTE result [skip ci]"
          file_pattern: data/testResults/*

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: memote-result
          path: results/head/memote_result.json
          if-no-files-found: ignore

      - name: Update the Model QC comment
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python code/python/tests/ci/pipeline.py comment \
            --repo "${{ github.repository }}" --issue "$PR" --body report.md
