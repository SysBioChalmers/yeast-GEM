name: Model QC

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'model/**'
      - 'code/python/tests/ci/model_qc.py'
      - 'code/python/tests/ci/build_qc_report.py'
      - '.github/workflows/model-qc.yml'

# One report per pull request. A newer push supersedes an in-flight run:
# its numbers would be stale the moment it finished.
concurrency:
  group: model-qc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write

    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The check names link to their explanation in the testResults README.
      # Pointed at the target branch, which is where the README is known to
      # exist even when this pull request has not touched it.
      URL_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/data/testResults

    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v7

      # The target branch is measured in this same run rather than read from
      # committed result files, so both sides of the delta come from the same
      # code, the same reference data and the same dependency versions. The
      # only difference between the two columns is the model itself.
      - name: Checkout the target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-checkout

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      # MACAW is installed from the upstream repository rather than PyPI:
      # that is the source Human-GEM uses, and the PyPI package of a similar
      # name is a different distribution.
      - name: Install dependencies
        run: |
          pip install cobra
          pip install "git+https://github.com/Devlin-Moyer/macaw.git@main" \
            || echo "::warning::MACAW is unavailable; its rows will show as not run"

      # Post immediately so the pull request shows that checks are under way,
      # rather than staying silent for the length of the run.
      - name: Post the running comment
        run: |
          python code/python/tests/ci/build_qc_report.py \
            --current "$RUNNER_TEMP/head" --running \
            --base-ref "$BASE_REF" --url-base "$URL_BASE" \
            --run-url "$RUN_URL" --out "$RUNNER_TEMP/report.md"

      - name: Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- MODEL-QC-COMMENT -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # continue-on-error: a check that crashes must not stop the other side
      # being measured, or the report being posted. The gate is applied at the
      # end from the metrics themselves.
      - name: Measure the pull request
        continue-on-error: true
        run: |
          python code/python/tests/ci/model_qc.py \
            --model model/yeast-GEM.xml --out "$RUNNER_TEMP/head"

      - name: Measure the target branch
        continue-on-error: true
        working-directory: base-checkout
        run: |
          python ../code/python/tests/ci/model_qc.py \
            --model model/yeast-GEM.xml --out "$RUNNER_TEMP/base"

      - name: Render the report
        if: ${{ !cancelled() }}
        run: |
          python code/python/tests/ci/build_qc_report.py \
            --current "$RUNNER_TEMP/head" --base "$RUNNER_TEMP/base" \
            --base-ref "$BASE_REF" --url-base "$URL_BASE" \
            --run-url "$RUN_URL" --out "$RUNNER_TEMP/report.md"

      - name: Update the comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- MODEL-QC-COMMENT -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The per-check CSVs are not committed, so they ride along here. Both
      # sides are uploaded: seeing what the target branch already had is what
      # turns a count into something actionable.
      - name: Upload the detail
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: model-qc-results
          path: |
            ${{ runner.temp }}/head
            ${{ runner.temp }}/base
          if-no-files-found: warn

      # Raised last, after the detail is uploaded and the comment updated, so
      # that a failure is always visible in both rather than only in a red
      # cross on a job whose output never got published.
      - name: Fail if the model cannot grow
        if: ${{ !cancelled() }}
        run: |
          growth=$(awk -F'\t' '$1 == "growth" { print $2 }' "$RUNNER_TEMP/head/qc_metrics.tsv")
          if [ -z "$growth" ]; then
            echo "::error::the pull-request checks did not produce a growth value"
            exit 1
          fi
          if awk "BEGIN { exit !($growth <= 1e-6) }"; then
            echo "::error::the model cannot produce biomass (growth = $growth)"
            exit 1
          fi
          echo "Growth $growth"
