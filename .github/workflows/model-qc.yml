name: Model QC

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'model/**'
      - 'data/physiology/**'
      - 'data/essentialGenes/**'
      - 'data/conditions/**'
      - 'code/python/**'
      - '.github/workflows/model-qc.yml'

# One report per pull request. A newer push supersedes an in-flight run:
# its numbers would be stale the moment it finished.
concurrency:
  group: model-qc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_REF: ${{ github.event.pull_request.base.ref }}

jobs:
  # Structural, balance and annotation checks. Python 3.11 because MACAW
  # pins pandas~=2.0.3, which has no cp312 wheel.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v7

      # The target branch is measured in this same run rather than read from
      # committed results, so both sides of the delta come from the same code,
      # the same reference data and the same dependency versions. The only
      # difference between the two columns is the model itself.
      - name: Checkout the target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-checkout

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # MACAW comes from the upstream repository, not PyPI: the
      # similarly-named PyPI package is a different distribution. numpy is
      # pinned in the same resolve because MACAW requires exactly 1.26.4.
      # rdkit (structure-consistency check) is a hard dependency, unlike
      # MACAW -- it ships a stable PyPI wheel, so there is no "unavailable"
      # case to fall back on.
      - name: Install dependencies
        run: |
          pip install cobra numpy==1.26.4 rdkit
          pip install "git+https://github.com/Devlin-Moyer/macaw.git@main" \
            || echo "::warning::MACAW is unavailable; its rows will show as not run"

      # --base-model-dir only on the pull-request side: deprecation-
      # completeness asks "what did this branch remove since the target
      # branch", which needs the target branch's own tsvs as the
      # comparison point. Measuring the target branch against itself
      # would just be empty, so it is left off that call below.
      - name: Measure the pull request
        continue-on-error: true
        run: |
          python code/python/tests/ci/model_qc.py \
            --model model/yeast-GEM.xml --out results/head \
            --base-model-dir base-checkout/model

      - name: Measure the target branch
        continue-on-error: true
        run: |
          python code/python/tests/ci/model_qc.py \
            --model base-checkout/model/yeast-GEM.xml --out results/base

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: qc-results
          path: results
          if-no-files-found: warn

  # Predictions against measured data. A separate job because it needs the
  # yeastgem package and a Gurobi licence, and because it is much slower: the
  # single-gene deletion sweep runs on both sides.
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v7

      - name: Checkout the target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-checkout

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem
        run: pip install -e "code/python/[gurobi]"

      # Best-effort: secrets are not exposed to pull requests from forks, and
      # the tolerances cover the difference between Gurobi and GLPK.
      - name: Install the Gurobi WLS licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: python code/python/tests/ci/pipeline.py licence

      # The model differs between the two calls; the reference data (chemostat
      # measurements, the deletion collection, the anaerobic exchange rates)
      # always comes from this checkout, so it is not a variable.
      - name: Measure the pull request
        continue-on-error: true
        run: |
          python code/python/tests/ci/check_metrics.py \
            --emit results/head/validation_metrics.tsv             --findings results/head/validation_findings.md

      - name: Measure the target branch
        continue-on-error: true
        run: |
          python code/python/tests/ci/check_metrics.py \
            --model base-checkout/model/yeast-GEM.xml \
            --emit results/base/validation_metrics.tsv

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: validation-results
          path: results
          if-no-files-found: warn

      # The two steps above are continue-on-error so that one failing side
      # still uploads the other. Without this the job reported success
      # having produced nothing at all -- which is how an exhausted Gurobi
      # licence came to look like a passing run.
      - name: Fail if neither side was measured
        if: ${{ !cancelled() }}
        run: |
          python code/python/tests/ci/pipeline.py require             --any results/head/validation_metrics.tsv                   results/base/validation_metrics.tsv

  # MEMOTE score, fast subset. A separate job for the same reason as
  # metrics: its own Gurobi licence, and it is slow enough (even with the
  # flux-variability and matrix-rank tests skipped -- see
  # memote_snapshot.py) that it should not gate the faster checks above.
  #
  # Only this branch is scored, not the target branch: MEMOTE, even the
  # fast subset, roughly doubles this job's cost if run twice, for a score
  # that mostly reflects annotation completeness rather than something a
  # typical pull request moves. Instead the report job compares against
  # the target branch's own last-committed score (see build_qc_report.py).
  memote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      # memote and gurobipy directly from PyPI, not
      # code/requirements/requirements.txt: that is a 2022 pip-compile
      # freeze kept for the release routine's own memote report, and
      # dragging its ~150 pinned packages into a routine pull-request job
      # for one package would be its own maintenance burden.
      - name: Install yeastgem and memote
        run: pip install -e "code/python/[gurobi]" memote

      - name: Install the Gurobi WLS licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: python code/python/tests/ci/pipeline.py licence

      - name: Score the pull request
        continue-on-error: true
        run: python code/python/tests/ci/memote_snapshot.py --out results/head

      # path: results, not results/head/memote_score.md, so the artifact
      # keeps the head/ prefix and merges into the same tree as the other
      # two artifacts in the report job below.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: memote-results
          path: results
          if-no-files-found: warn

  # MetaNetX-based annotation verification (yeast-GEM#379). A separate job:
  # it needs its own ~200MB reference-table download (cached across runs
  # below) and no Gurobi licence, unlike every other job here. Like memote,
  # only this branch is checked -- see verify_annotations.py's own
  # docstring for why re-running it on the target branch in the same job
  # is not worth its cost, and why this never gates the merge.
  annotation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cobra rdkit

      # Bump the key (e.g. metanetx-v2) if verify_annotations.py's
      # ensure_metanetx() ever changes which columns it keeps from
      # MetaNetX's reference tables -- the cached files would otherwise be
      # silently stale in the old schema. See the mnx_chem.tsv rename in
      # its history for the same situation on a developer's own machine.
      - name: Cache the MetaNetX reference tables
        uses: actions/cache@v4
        with:
          path: data/databases/.metanetx
          key: metanetx-v1

      - name: Verify annotation against MetaNetX
        continue-on-error: true
        run: python code/python/annotation/verify_annotations.py --all --out results/head

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: annotation-results
          path: results
          if-no-files-found: warn

  # Renders one comment from all three jobs above, commits the detail, then
  # applies the gate. Split out so that the comment is written once from
  # everything rather than several times, and so a slow job does not hold
  # up the others' results.
  report:
    runs-on: ubuntu-latest
    needs: [checks, metrics, memote, annotation]
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    env:
      # The head branch, not the base: a pull request that adds a check also
      # adds its explanation to the README, and linking at the base branch
      # would point every new check name at a heading that does not exist
      # there yet.
      URL_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.head_ref }}/data/testResults
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Both artifacts use the same head/base layout, so they merge into one
      # tree and the renderer reads whichever files are present.
      - uses: actions/download-artifact@v7
        with:
          name: qc-results
          path: results
      # continue-on-error: the metrics job may have produced nothing (a
      # refused solver licence, say). The report then shows the validation
      # rows as "not run", which is the honest outcome -- it must not take
      # the whole report down with it.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: validation-results
          path: results
      # Same reasoning as validation-results: the memote job may have
      # produced nothing.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: memote-results
          path: results
      # Same reasoning again: the annotation job may have produced nothing
      # (e.g. MetaNetX unreachable).
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: annotation-results
          path: results

      # MEMOTE and the annotation summary are both compared against the
      # target branch's own last commit, not a fresh run in this job (see
      # the memote/annotation jobs above) -- so fetch just those two files
      # rather than a full second checkout.
      - name: Fetch the target branch's committed MEMOTE score and annotation summary
        run: |
          mkdir -p results/base
          git fetch --depth=1 origin "$BASE_REF"
          git show "origin/$BASE_REF:data/testResults/memote_score.md" \
            > results/base/memote_score.md 2>/dev/null || true
          git show "origin/$BASE_REF:data/testResults/annotation_metrics.tsv" \
            > results/base/annotation_metrics.tsv 2>/dev/null || true

      # Copy the detail into the repository so it is tracked: the committed
      # files are what the counts in the comment link to, and what makes a
      # change in them visible in the pull request's own diff.
      - name: Update the tracked results
        run: |
          python code/python/tests/ci/pipeline.py collect             --source results/head --dest data/testResults

      - name: Render the report
        run: |
          python code/python/tests/ci/build_qc_report.py \
            --current results/head --base results/base \
            --base-ref "$BASE_REF" --url-base "$URL_BASE" \
            --detail-base "$URL_BASE" \
            --run-url "$RUN_URL" --out report.md

      # Committed before the comment is posted, so that by the time a count
      # links to a CSV, that CSV is on the branch. [skip ci] keeps the results
      # commit from starting another run. Skipped for forks, where the token
      # is read-only.
      - name: Commit the results
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: yeast-gem-bot
          commit_message: "chore: update model QC results [skip ci]"
          file_pattern: data/testResults/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post the report
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python code/python/tests/ci/pipeline.py comment             --repo "${{ github.repository }}"             --issue "${{ github.event.pull_request.number }}"             --body report.md

      # Raised last, after the detail is committed and the comment posted, so
      # a failure is always visible in both rather than only as a red cross on
      # a job whose output never got published.
      - name: Apply the merge gate
        run: |
          python code/python/tests/ci/pipeline.py gate             --metrics results/head/qc_metrics.tsv
