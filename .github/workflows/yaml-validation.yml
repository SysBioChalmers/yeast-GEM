name: YAML validation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  yaml-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          ## File(s) or Directory, separate by space if multiple files or folder are specified
          file_or_dir: model/
          ## Custom configuration (as YAML source)
          # indent-sequences: false -- RAVEN and raven-toolbox now write
          # model/yeast-GEM.yml in a shared layout (yeast-GEM#397) that
          # nests a sequence at the same indentation as its parent
          # mapping key, which is legal YAML but conflicts with
          # yamllint's stricter default. Re-indenting the file to satisfy
          # the default instead would only diverge from that shared
          # writer and get overwritten on the next legitimate write.
          config_data: "{extends: default, rules: {line-length: disable, indentation: {indent-sequences: false}}}"
          ## Format for parsing output [parsable,standard,colored,auto]
          # format: # optional, default is colored
          ## Return non-zero exit code on warnings as well as errors
          # strict: # optional, default is false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Import with cobrapy
        run: |
          pip install cobra
          python -c "import cobra ; cobra.io.load_yaml_model('model/yeast-GEM.yml')"
