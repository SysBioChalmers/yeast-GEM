name: PR command

# Starts long, optional jobs from a comment on a pull request. issue_comment
# workflows run from the default branch, so this takes effect once it is on main.
#
# Commands (the comment must start with the command; only the repository's
# owner, members and collaborators can use them):
#   /run memote   run the full MEMOTE suite on the pull request branch
#
# To add a command, copy the job below, change the command in its `if`, and
# dispatch the workflow that does the work.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write        # dispatch workflow_dispatch workflows
  pull-requests: write  # reply on the pull request

jobs:
  memote:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/run memote')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the full MEMOTE suite on the pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          data=$(gh pr view "$PR" --repo "$REPO" --json headRefName,isCrossRepository)
          ref=$(echo "$data" | jq -r .headRefName)
          fork=$(echo "$data" | jq -r .isCrossRepository)
          if [ "$fork" = "true" ]; then
            gh pr comment "$PR" --repo "$REPO" \
              --body ":warning: \`/run memote\` only works for branches in this repository, not forks."
            exit 0
          fi
          gh workflow run memote-full.yml --repo "$REPO" --ref "$ref" -f pr="$PR"
          gh pr comment "$PR" --repo "$REPO" \
            --body "Started the full MEMOTE suite on \`$ref\` (this takes hours). Track it in the [Actions tab]($GITHUB_SERVER_URL/$REPO/actions/workflows/memote-full.yml); the score updates the Model QC comment when it finishes."
