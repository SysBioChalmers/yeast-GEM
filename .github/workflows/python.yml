name: Python

on:
  push:
    branches: [main, develop]
    paths:
      - 'code/python/**'
      - 'code/io.py'
      - 'data/yeastgem/**'
      - 'data/conditions/**'
      - 'data/essentialGenes/**'
      - 'data/physiology/**'
      - 'model/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'code/python/**'
      - 'code/io.py'
      - 'data/yeastgem/**'
      - 'data/conditions/**'
      - 'data/essentialGenes/**'
      - 'data/physiology/**'
      - 'model/**'
      - '.github/workflows/python.yml'

jobs:
  # Unit tests + lint across the supported Python matrix. Fast (~5 min
  # wall clock per Python version after caches warm).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem (editable, with dev deps)
        run: pip install -e "code/python/[dev]"

      - name: Lint with ruff
        run: ruff check code/python

      - name: Run pytest
        working-directory: code/python
        run: pytest -v

  # Level-1 parity — Python SBML read+write of the committed
  # model/yeast-GEM.xml must round-trip to a semantically-equal model.
  # Catches SBML library regressions, annotation losses, and
  # accidental id rewrites.
  parity-level-1-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem
        run: pip install -e code/python/

      - name: SBML round-trip preserves model
        run: python code/python/tests/ci/check_round_trip.py

  # Level-2 parity — Python validation metrics must match the
  # committed MATLAB-produced reference within tolerance. Tolerances
  # cover both solver drift on the R^2 metrics and a one-gene difference
  # in the essential-gene confusion matrix that is not solver-related (it
  # persists when Python also uses Gurobi). See metrics.json for details. Regenerate the reference via
  # code/python/tests/reference/runPhase5Metrics.m when the metrics
  # shift legitimately.
  parity-level-2-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      # The MATLAB reference is produced with Gurobi. Using it here too
      # removes the solver as a variable in the comparison. The licence
      # lives in repository secrets, which are unavailable to pull
      # requests from forks, so this is best-effort: without it cobrapy
      # falls back to GLPK and the tolerances still cover the difference.
      - name: Install yeastgem
        env:
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
        run: |
          if [ -n "$WLSACCESSID" ]; then
            pip install -e "code/python/[gurobi]"
          else
            pip install -e code/python/
          fi

      - name: Configure Gurobi WLS licence
        env:
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: |
          # Report which parts are visible, never their values, so a
          # misnamed or unshared secret is diagnosable from the log.
          for v in WLSACCESSID WLSSECRET LICENSEID; do
            eval "val=\${$v}"
            if [ -n "$val" ]; then
              echo "$v: set (${#val} chars)"
            else
              echo "$v: EMPTY"
            fi
          done
          if [ -z "$WLSACCESSID" ] || [ -z "$WLSSECRET" ] || [ -z "$LICENSEID" ]; then
            echo "Gurobi WLS licence not fully available; cobrapy will use GLPK."
            echo "If the secrets exist org-wide, check they are Actions secrets"
            echo "(not Dependabot/Codespaces) and that this repository is in"
            echo "the secret's repository-access list."
            exit 0
          fi
          umask 077
          {
            echo "WLSACCESSID=$WLSACCESSID"
            echo "WLSSECRET=$WLSSECRET"
            echo "LICENSEID=$LICENSEID"
          } > "$HOME/gurobi.lic"
          echo "GRB_LICENSE_FILE=$HOME/gurobi.lic" >> "$GITHUB_ENV"

      - name: Validation metrics match the committed reference
        run: python code/python/tests/ci/check_metrics.py
