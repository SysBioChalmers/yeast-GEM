name: Python

on:
  push:
    branches: [main, develop]
    paths:
      - 'code/python/**'
      - 'code/io.py'
      - 'data/yeastgem/**'
      - 'data/conditions/**'
      - 'data/essentialGenes/**'
      - 'data/physiology/**'
      - 'model/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'code/python/**'
      - 'code/io.py'
      - 'data/yeastgem/**'
      - 'data/conditions/**'
      - 'data/essentialGenes/**'
      - 'data/physiology/**'
      - 'model/**'
      - '.github/workflows/python.yml'

jobs:
  # Unit tests + lint across the supported Python matrix. Fast (~5 min
  # wall clock per Python version after caches warm).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem (editable, with dev deps)
        run: pip install -e "code/python/[dev]"

      - name: Lint with ruff
        run: ruff check code/python

      - name: Run pytest
        working-directory: code/python
        run: pytest -v

  # Level-1 parity — Python SBML read+write of the committed
  # model/yeast-GEM.xml must round-trip to a semantically-equal model.
  # Catches SBML library regressions, annotation losses, and
  # accidental id rewrites.
  parity-level-1-round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem
        run: pip install -e code/python/

      - name: SBML round-trip preserves model
        run: python code/python/tests/ci/check_round_trip.py

  # Level-2 parity — Python validation metrics must match the
  # committed MATLAB-produced reference within tolerance. Tolerances
  # cover both solver drift on the R^2 metrics and a one-gene difference
  # in the essential-gene confusion matrix that is not solver-related (it
  # persists when Python also uses Gurobi). See check_metrics.py for details. The reference
  # values live in data/testResults/README.md and are regenerated at
  # release time.
  parity-level-2-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: test
    # Needed to post the results comment. Declared explicitly rather than
    # relying on the repository-wide default, which is read-only in many
    # configurations and would make the comment step fail.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The target branch is measured in this same run, so both columns of the
      # comparison come from the same code, the same reference data and the
      # same solver. Only on pull requests: a push has nothing to compare to
      # and falls back to the committed table.
      - name: Checkout the target branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-checkout

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      # The MATLAB reference is produced with Gurobi. Using it here too
      # removes the solver as a variable in the comparison. The licence
      # lives in repository secrets, which are unavailable to pull
      # requests from forks, so this is best-effort: without it cobrapy
      # falls back to GLPK and the tolerances still cover the difference.
      - name: Install yeastgem
        run: pip install -e "code/python/[gurobi]"

      # The licence is supplied either as a complete licence file or as its
      # three separate fields; accept whichever is configured. Falling back
      # to GLPK is deliberate rather than a hard failure here, because
      # secrets are not exposed to pull requests from forks and the
      # tolerances still cover the solver difference.
      - name: Install the Gurobi WLS licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: |
          umask 077
          licence="$HOME/gurobi.lic"
          if [ -n "$LICENCE_FILE" ]; then
            echo "$LICENCE_FILE" > "$licence"
          elif [ -n "$WLSACCESSID" ] && [ -n "$WLSSECRET" ] && [ -n "$LICENSEID" ]; then
            { echo "WLSACCESSID=$WLSACCESSID"
              echo "WLSSECRET=$WLSSECRET"
              echo "LICENSEID=$LICENSEID"
            } > "$licence"
          else
            echo "No Gurobi licence configured; cobrapy will use GLPK."
            exit 0
          fi
          # Report the shape without printing the value. A named-user academic
          # licence is tied to one machine and cannot authenticate on a hosted
          # runner, which otherwise looks like a solver bug.
          if grep -q "^[[:space:]]*WLSACCESSID=" "$licence"; then
            echo "Gurobi WLS licence installed"
          else
            echo "::warning::the configured licence is not a WLS licence, so it will not authenticate on a hosted runner"
          fi
          echo "GRB_LICENSE_FILE=$licence" >> "$GITHUB_ENV"

      # Measuring both sides doubles the work of this job; the essential-gene
      # sweep is the bulk of it. continue-on-error so the comment is posted
      # even when a metric regresses; the gate below restores the failure.
      - name: Validation metrics vs the target branch
        id: metrics
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--markdown "$RUNNER_TEMP/metrics.md" --run-url "$RUN_URL")
          if [ -d base-checkout ]; then
            args+=(--base-model base-checkout/model/yeast-GEM.xml --base-ref "$BASE_REF")
          fi
          python code/python/tests/ci/check_metrics.py "${args[@]}"

      # GITHUB_TOKEN is read-only on pull requests from forks, so posting is
      # skipped there. The metrics still run and still gate the merge; they are
      # reported in the log instead.
      - name: Report the metrics on the pull request
        if: >-
          !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- VALIDATION-METRICS-COMMENT -->';
            const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/metrics.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if a metric got worse
        if: ${{ !cancelled() && steps.metrics.outcome == 'failure' }}
        run: |
          echo "::error::a validation metric regressed; see the pull-request comment"
          exit 1
