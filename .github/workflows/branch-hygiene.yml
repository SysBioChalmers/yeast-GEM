name: Branch hygiene

# The binary model files are generated at release time and belong on main
# only. .gitignore cannot keep them off develop: it is consulted only for
# untracked paths, so once the files are tracked on main, any merge of main
# into develop carries them across regardless. This check is the thing that
# actually prevents it.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  no-binaries-on-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # On a pull_request event this runs against the *merge result*, not the
      # PR branch, so it answers "would develop contain these once this is
      # merged?" -- which also catches files arriving through a merge commit
      # rather than being added directly.
      - name: No binary model files on develop
        run: |
          found=$(git ls-files '*.mat' '*.xls' '*.xlsx' '*.xlsm')
          if [ -n "$found" ]; then
            echo "::error::Binary model files are tracked, but belong on main only:"
            echo "$found" | sed 's/^/  /'
            echo ""
            echo "These are generated at release time by exportForGit and are"
            echo "committed on main. If they arrived here through a merge of"
            echo "main into develop, drop them in the merge commit:"
            echo ""
            echo "  git rm --cached $(echo $found | tr '\n' ' ')"
            echo ""
            echo "A local, untracked copy is fine -- this only rejects tracked files."
            exit 1
          fi
          echo "No binary model files tracked on develop."
