name: Branch hygiene

# The binary model files and version.txt are generated or stamped at
# release time and belong on main only -- develop is never "at" a
# version, it is ahead of the last release by an unknown number of
# increments. .gitignore cannot keep them off develop: it is consulted
# only for untracked paths, so once a file is tracked on main, any merge
# of main into develop carries it across regardless. This check is the
# thing that actually prevents it.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  no-release-artifacts-on-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # On a pull_request event this runs against the *merge result*, not the
      # PR branch, so it answers "would develop contain these once this is
      # merged?" -- which also catches files arriving through a merge commit
      # rather than being added directly.
      - name: No release-only files on develop
        run: |
          # model/yeast-GEM.xml and .txt are exact paths, not globs: a glob
          # (e.g. '*.txt') would false-positive on model/dependencies.txt and
          # data/essentialGenes/*.txt, both legitimately tracked on develop.
          # Nothing reads or writes model/yeast-GEM.xml/.txt from develop any
          # more (yeast-GEM#379 stage 2) -- they are generated on demand by
          # commitYeastModel/commit_yeast_model, or produced at release time.
          found=$(git ls-files '*.mat' '*.xls' '*.xlsx' '*.xlsm' 'version.txt' \
            'model/yeast-GEM.xml' 'model/yeast-GEM.txt')
          if [ -n "$found" ]; then
            echo "::error::These are generated or stamped at release time, but belong on main only:"
            echo "$found" | sed 's/^/  /'
            echo ""
            echo "If they arrived here through a merge of main into develop,"
            echo "drop them in the merge commit:"
            echo ""
            echo "  git rm --cached $(echo $found | tr '\n' ' ')"
            echo ""
            echo "A local, untracked copy is fine -- this only rejects tracked files."
            exit 1
          fi
          echo "No release-only files tracked on develop."
