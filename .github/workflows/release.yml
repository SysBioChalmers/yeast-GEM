name: Release

# Cuts a release branch from develop, runs the Python side of the release
# (code/python/release/increase_version.py -- a full port of
# code/increaseVersion.m), regenerates the binary model files with RAVEN,
# takes a memote snapshot, and opens the release PR into main for a human
# to approve. On merge, tags the release, publishes it on GitHub, and opens
# the sync-back PR into develop.
#
# See .github/CONTRIBUTING.md, "Releasing a new version", for the routine
# this replaces, and the scratchpad plan this was built from for the
# reasoning behind cutting from develop rather than main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 9.1.1 -- must match the top heading in history.md"
        required: true
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- Cut the branch --------------------------------------------------

  cut:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: release/${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install yeastgem
        run: pip install -e code/python/

      # Fails loudly here, before a branch exists, rather than partway
      # through the build job.
      - name: Validate the version
        run: |
          python code/python/release/increase_version.py validate \
            --version "${{ github.event.inputs.version }}"

      - name: Cut the release branch
        run: |
          git checkout -b "release/${{ github.event.inputs.version }}"
          git push origin "release/${{ github.event.inputs.version }}"

  # --- Python side of the release ---------------------------------------

  build:
    needs: cut
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.cut.outputs.branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/python/pyproject.toml

      - name: Install yeastgem
        run: pip install -e "code/python/[gurobi]"

      - name: Install the Gurobi WLS licence
        env:
          LICENCE_FILE: ${{ secrets.GUROBI_EDUARD }}
          WLSACCESSID: ${{ secrets.GUROBI_WLSACCESSID }}
          WLSSECRET: ${{ secrets.GUROBI_WLSSECRET }}
          LICENSEID: ${{ secrets.GUROBI_LICENSEID }}
        run: python code/python/tests/ci/pipeline.py licence

      - name: Run the release build
        run: |
          python code/python/release/increase_version.py build \
            --version "${{ github.event.inputs.version }}"

      # release/X.Y.Z is not protected, so the default token can push to it
      # directly -- everything into main or develop still goes through a
      # reviewed PR.
      - name: Commit
        run: |
          git config user.name "yeast-gem-bot"
          git config user.email "yeast-gem-bot@users.noreply.github.com"
          git add version.txt model/yeast-GEM.yml README.md data/testResults/
          git commit -m "chore: version ${{ github.event.inputs.version }}"
          git push

  # --- Binary model files (RAVEN, MATLAB) --------------------------------
  #
  # UNVERIFIED. Everything above this point was tested against the real
  # repository before this workflow was written -- this job was not, since
  # doing so needs a MATLAB run this environment cannot perform. Treat the
  # first real run of this job as a dry run: watch it, and check the
  # binaries it produces before trusting them.

  export-binaries:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/${{ github.event.inputs.version }}

      # getToolboxVersion walks up to a .git directory to find RAVEN's
      # version for model/dependencies.txt, so RAVEN has to be an
      # actual checkout (which actions/checkout provides), not an
      # extracted release archive -- see the note in code/increaseVersion.m
      # history for why this bit a release before.
      #
      # v3.0.0-rc1, not main or develop: readYAMLmodel/writeYAMLmodel/
      # exportForGit only agree with the model/yeast-GEM.yml format written
      # by raven-toolbox>=0.4.0 (adopted in yeast-GEM #396/#397) as of RAVEN
      # #698/#699, which shipped in v3.0.0-rc1 but are still absent from
      # main/develop and from every released 2.11.x. Move this to a
      # stable release tag once RAVEN cuts one that includes them.
      - name: Checkout RAVEN
        uses: actions/checkout@v7
        with:
          repository: SysBioChalmers/RAVEN
          ref: v3.0.0-rc1
          path: RAVEN

      - uses: matlab-actions/setup-matlab@v3

      # exportForGit alone, not saveYeastModel: saveYeastModel re-applies
      # minimal media, re-adds SBO terms, re-validates and re-checks
      # growth -- all needing a solver, all re-deriving what the Python
      # build step already wrote and already tested. exportForGit just
      # writes the four derived files from the .yml the Python step
      # stamped.
      - name: Export .xml, .txt, .xlsx and .mat
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(genpath('RAVEN'));
            cd model;
            model = readYAMLmodel('yeast-GEM.yml');
            exportForGit(model, 'yeast-GEM', '.', {'xml', 'txt', 'xlsx', 'mat'}, false, false);

      - name: Commit
        run: |
          git config user.name "yeast-gem-bot"
          git config user.email "yeast-gem-bot@users.noreply.github.com"
          git add -f model/yeast-GEM.xml model/yeast-GEM.txt \
            model/yeast-GEM.xlsx model/yeast-GEM.mat model/dependencies.txt
          git commit -m "chore: export model files for ${{ github.event.inputs.version }}"
          git push

  # --- Memote, then open the PR ------------------------------------------

  open-pr:
    needs: export-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/${{ github.event.inputs.version }}

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Create .env
        run: touch .env

      - name: Install memote
        run: |
          # code/requirements/requirements.txt is a 2022 pip-compile freeze;
          # bleach==5.0.0's metadata is malformed and pip>=24.1 rejects it
          # outright instead of tolerating it as older pip did.
          python -m pip install "pip<24.1"
          pip install -r code/requirements/requirements.txt

      # Visible before approval rather than discovered after merge --
      # the whole point of moving this here from the release: published
      # trigger. That trigger still exists on memote-release.yml as a
      # fallback for a release published by hand outside this workflow,
      # since a GITHUB_TOKEN-authored release from the finalize job below
      # will not fire it (GITHUB_TOKEN actions do not trigger further
      # workflow runs).
      - name: Memote snapshot
        run: |
          memote report snapshot --solver-timeout 30 \
            --filename="gh-pages-repo/release_report.html"

      - name: Fetch async changes in gh-pages
        run: |
          cd gh-pages-repo
          git pull

      - name: Commit the memote report
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: yeast-gem-bot
          commit_message: "chore: memote snapshot for ${{ github.event.inputs.version }}"
          file_pattern: release_report.html
          branch: gh-pages
          repository: gh-pages-repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head "release/${{ github.event.inputs.version }}" \
            --title "chore: version ${{ github.event.inputs.version }}" \
            --body "Automated release build for ${{ github.event.inputs.version }}. Review the model-quality and validation-metrics comment below, and the [memote snapshot](https://sysbiochalmers.github.io/yeast-GEM/release_report.html), before approving."

  # --- On merge: tag, release, sync back ----------------------------------

  finalize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.pull_request.head.ref }}"
          version="${version#release/}"
          gh release create "v$version" --target main --title "v$version" \
            --notes "See [history.md](https://github.com/${{ github.repository }}/blob/main/history.md)."

      # Everything except the binaries: main after the release is develop
      # plus a reviewable series of commits (the release branch's own
      # history), so this is an ordinary merge rather than the kind of
      # merge-commit-only content that caused the divergence this replaced.
      - name: Open the sync-back pull request into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ github.event.pull_request.head.ref }}"
          version="${version#release/}"
          git config user.name "yeast-gem-bot"
          git config user.email "yeast-gem-bot@users.noreply.github.com"
          git fetch origin develop
          git checkout -b "sync/main-to-develop-$version" origin/develop
          git merge --no-commit --no-ff origin/main
          git rm --cached model/yeast-GEM.mat model/yeast-GEM.xlsx
          git commit -m "chore: merge main into develop after $version, without binaries"
          git push origin "sync/main-to-develop-$version"
          gh pr create --base develop --head "sync/main-to-develop-$version" \
            --title "chore: sync main into develop after $version" \
            --body "Brings $version back into develop, keeping the binary model files off it. See branch-hygiene.yml, which would otherwise flag them."
