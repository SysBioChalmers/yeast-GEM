name: memote release

on:
  release:
    types: [published]

# The job pushes to gh-pages. Serialise it against anything else that
# deploys there so the two cannot fight over the same branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  memote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Create .env
        run: touch .env

      - name: Install memote
        run: pip install -r code/requirements/requirements.txt

      # Pull before writing the report, not after: the report is generated
      # into the gh-pages checkout, so pulling afterwards merges into a dirty
      # tree and aborts.
      - name: Fetch async changes in gh-pages
        run: |
          cd gh-pages-repo
          git pull

      - name: Memote run
        run: |
          memote report snapshot --solver-timeout 30 --filename="gh-pages-repo/release_report.html"

      - name: Auto-commit results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_user_name: memote-bot
          commit_message: "chore: update memote release report"
          file_pattern: release_report.html
          branch: gh-pages
          repository: gh-pages-repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
